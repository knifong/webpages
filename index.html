<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Quick Calc</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #202b2b;
			--muted: #64716e;
			--paper: #f7f5ef;
			--panel: #fffefa;
			--line: #d8ded7;
			--green: #245c4b;
			--orange: #e46b42;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 28px 18px;
			color: var(--ink);
			background-color: var(--paper);
			background-image: radial-gradient(#d7dfd4 0.8px, transparent 0.8px);
			background-size: 19px 19px;
			font-family: "Trebuchet MS", "Segoe UI", sans-serif;
		}

		main {
			width: min(100%, 640px);
			overflow: hidden;
			background: var(--panel);
			border: 1px solid var(--line);
			border-radius: 8px;
			box-shadow: 0 18px 50px #263b3217;
			animation: arrive 420ms ease-out both;
		}

		header {
			padding: 36px 38px 30px;
			color: #fffefa;
			background: var(--green);
			border-bottom: 5px solid var(--orange);
		}

		.eyebrow {
			margin: 0 0 8px;
			color: #c9ded0;
			font-size: 12px;
			font-weight: 700;
			text-transform: uppercase;
		}

		h1 { margin: 0; font-size: 36px; }

		header p:last-child {
			margin: 8px 0 0;
			color: #e2ece4;
			font-size: 16px;
		}

		form { padding: 34px 38px 38px; }

		.fields {
			display: grid;
			grid-template-columns: 1fr auto 1fr;
			align-items: end;
			gap: 12px;
		}

		label {
			display: block;
			margin-bottom: 8px;
			color: var(--muted);
			font-size: 15px;
			font-weight: 700;
		}

		input, select, button { font: inherit; }

		input, select {
			width: 100%;
			height: 60px;
			padding: 0 14px;
			color: var(--ink);
			background: #fff;
			border: 1px solid var(--line);
			border-radius: 5px;
			font-size: 21px;
		}

		option { font-size: 20px; }

		input:focus, select:focus, button:focus-visible {
			outline: 3px solid #e46b4255;
			outline-offset: 2px;
		}

		.operator { width: 116px; }

		button {
			width: 100%;
			min-height: 60px;
			margin-top: 26px;
			color: white;
			background: var(--orange);
			border: 0;
			border-radius: 5px;
			font-size: 18px;
			font-weight: 700;
			cursor: pointer;
			transition: background-color 140ms ease, transform 140ms ease;
		}

		button:hover { background: #c95330; }
		button:active { transform: translateY(1px); }

		.result {
			min-height: 112px;
			margin-top: 26px;
			padding: 20px 22px;
			background: #edf3ec;
			border-left: 4px solid var(--green);
			border-radius: 4px;
		}

		.result-label {
			display: block;
			margin-bottom: 5px;
			color: var(--muted);
			font-size: 12px;
			font-weight: 700;
			text-transform: uppercase;
		}

		output { font-size: 30px; font-weight: 700; overflow-wrap: anywhere; }
		output.error { color: #a53e2e; font-size: 15px; }

		.key {
			margin: 17px 0 0;
			color: var(--muted);
			font-size: 15px;
			line-height: 1.7;
		}

		.key strong { color: var(--ink); }

		@keyframes arrive {
			from { opacity: 0; transform: translateY(8px); }
			to { opacity: 1; transform: translateY(0); }
		}

		@media (max-width: 430px) {
			header, form { padding-right: 20px; padding-left: 20px; }
			.fields { grid-template-columns: 1fr 88px 1fr; gap: 8px; }
			.operator { width: 88px; }
			input, select { font-size: 18px; }
			option { font-size: 18px; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
		}
	</style>
</head>
<body>
	<main>
		<header>
			<p class="eyebrow">A little arithmetic</p>
			<h1>Quick Calc</h1>
			<p>Enter two numbers and choose what to do with them.</p>
		</header>
		<form id="calculator">
			<div class="fields">
				<div>
					<label for="first-number">First number</label>
					<input id="first-number" name="first" type="number" step="any" placeholder="12" required>
				</div>
				<div class="operator">
					<label for="operation">Op</label>
					<select id="operation" name="operation" aria-label="Calculation operation">
						<option value="a">a +</option>
						<option value="s">s -</option>
						<option value="m">m x</option>
						<option value="d">d /</option>
						<option value="e">e ^</option>
					</select>
				</div>
				<div>
					<label for="second-number">Second number</label>
					<input id="second-number" name="second" type="number" step="any" placeholder="3" required>
				</div>
			</div>
			<button type="submit">Calculate</button>
			<div class="result" aria-live="polite">
				<span class="result-label">Result</span>
				<output id="answer" for="first-number operation second-number">Your answer will appear here</output>
			</div>
			<p class="key"><strong>Operation key:</strong> a = add, s = subtract, m = multiply, d = divide, e = exponent</p>
		</form>
	</main>
	<script>
		const form = document.querySelector("#calculator");
		const answer = document.querySelector("#answer");

		form.addEventListener("submit", (event) => {
			event.preventDefault();
			const first = Number(form.elements.first.value);
			const second = Number(form.elements.second.value);
			const operation = form.elements.operation.value;
			let result;

			switch (operation) {
				case "a": result = first + second; break;
				case "s": result = first - second; break;
				case "m": result = first * second; break;
				case "d":
					if (second === 0) {
						showError("Cannot divide by zero.");
						return;
					}
					result = first / second;
					break;
				case "e": result = first ** second; break;
			}

			if (!Number.isFinite(result)) {
				showError("That calculation does not have a finite result.");
				return;
			}

			answer.classList.remove("error");
			answer.textContent = Number(result.toPrecision(12)).toString();
		});

		function showError(message) {
			answer.classList.add("error");
			answer.textContent = message;
		}
	</script>
</body>
</html>
